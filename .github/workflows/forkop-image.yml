name: Build OpenWrt Forkop image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkop-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENWRT_VERSION: 25.12.6
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout image configuration
        uses: actions/checkout@v5

      - name: Install build prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y build-essential curl fakeroot file gawk git jq make patch perl python3 rsync tar unzip util-linux wget xz-utils zstd

      - name: Resolve Forkop release
        id: forkop_release
        run: |
          tag="$(gh release view --repo ushan0v/forkop --json tagName --jq .tagName)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout Forkop sources
        uses: actions/checkout@v5
        with:
          repository: ushan0v/forkop
          ref: ${{ steps.forkop_release.outputs.tag }}
          path: upstream/forkop
          persist-credentials: false

      - name: Build Forkop packages for OpenWrt 25.12.6
        shell: bash
        run: |
          sdk="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/openwrt-sdk-${OPENWRT_VERSION}-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          mkdir -p "$RUNNER_TEMP/forkop-packages"
          cd upstream/forkop
          APK_SDK_URL="$sdk" IPK_SDK_URL="$sdk" ./build.sh "${{ steps.forkop_release.outputs.version }}" "$RUNNER_TEMP/forkop-packages"

      - name: Download and verify sing-box-forkop FULL
        shell: bash
        run: |
          dir="$RUNNER_TEMP/forkop-core"
          mkdir -p "$dir"
          tag="$(gh release view --repo ushan0v/sing-box-forkop --json tagName --jq .tagName)"
          gh release download "$tag" --repo ushan0v/sing-box-forkop --pattern '*_full_x86_64.apk' --pattern SHA256SUMS --dir "$dir"
          core="$(find "$dir" -maxdepth 1 -type f -name '*_full_x86_64.apk' -print -quit)"
          test -n "$core"
          name="$(basename "$core")"
          expected="$(awk -v n="$name" '$2 == n || $2 == "./" n {print $1; exit}' "$dir/SHA256SUMS")"
          test -n "$expected"
          actual="$(sha256sum "$core" | awk '{print $1}')"
          test "$expected" = "$actual"
          required="$(sed -n 's/.*SB_REQUIRED_VERSION: "\([^"]*\)".*/\1/p' upstream/forkop/forkop/files/usr/lib/core/constants.uc)"
          core_version="$(printf '%s' "$name" | sed -E 's/^sing-box-forkop_([^_]+)_full_x86_64\.apk$/\1/')"
          test -n "$required"
          test "$required" = "$core_version"
          cp "$core" "$RUNNER_TEMP/forkop-packages/"

      - name: Checkout Argon theme sources
        uses: actions/checkout@v5
        with:
          repository: jerrykuku/luci-theme-argon
          path: upstream/luci-theme-argon
          persist-credentials: false

      - name: Build Argon packages for OpenWrt 25.12.6
        shell: bash
        run: |
          sdk="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/openwrt-sdk-${OPENWRT_VERSION}-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          archive="$RUNNER_TEMP/argon-sdk.tar.zst"
          sdk_dir="$RUNNER_TEMP/argon-sdk"
          curl --fail --location --retry 3 "$sdk" -o "$archive"
          mkdir -p "$sdk_dir"
          tar --zstd -xf "$archive" -C "$sdk_dir" --strip-components=1
          cd "$sdk_dir"
          ./scripts/feeds update luci
          rm -rf package/luci-theme-argon
          cp -a "$GITHUB_WORKSPACE/upstream/luci-theme-argon" package/luci-theme-argon
          make package/luci-theme-argon/compile -j"$(nproc)"
          mkdir -p "$RUNNER_TEMP/argon-packages"
          find bin/packages -type f \( -name 'luci-theme-argon_*.apk' -o -name 'luci-i18n-argon-config-ru_*.apk' \) -exec cp -t "$RUNNER_TEMP/argon-packages" {} +
          test -n "$(find "$RUNNER_TEMP/argon-packages" -type f -name 'luci-theme-argon_*.apk' -print -quit)"

      - name: Download OpenWrt ImageBuilder
        shell: bash
        run: |
          url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"
          archive="$RUNNER_TEMP/imagebuilder.tar.zst"
          curl --fail --location --retry 3 "$url" -o "$archive"
          echo "a792e29bd2233cda67a0823030bfb53c0b61fbb3836b2063e88adf89730d563b  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/imagebuilder"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/imagebuilder" --strip-components=1
          cp "$RUNNER_TEMP/forkop-packages/"*.apk "$RUNNER_TEMP/imagebuilder/packages/"
          cp "$RUNNER_TEMP/forkop-core/"*_full_x86_64.apk "$RUNNER_TEMP/imagebuilder/packages/"
          cp "$RUNNER_TEMP/argon-packages/"*.apk "$RUNNER_TEMP/imagebuilder/packages/"
          chmod 0755 files/etc/uci-defaults/99-home-router-network
          ls -lh "$RUNNER_TEMP/imagebuilder/packages/"*.apk
          (
            cd "$RUNNER_TEMP/imagebuilder/packages"
            ../staging_dir/host/bin/apk mkndx --allow-untrusted --output packages.adb *.apk
          )
          test -s "$RUNNER_TEMP/imagebuilder/packages/packages.adb"

      - name: Build UEFI EXT4 firmware
        working-directory: ${{ runner.temp }}/imagebuilder
        run: |
          make image PROFILE=generic \
            PACKAGES="luci-ssl luci-i18n-base-ru luci-theme-argon kmod-r8169 r8169-firmware forkop luci-app-forkop luci-i18n-forkop-ru sing-box-forkop" \
            FILES="${{ github.workspace }}/files" \
            EXTRA_IMAGE_NAME="forkop"

      - name: Prepare firmware artifact
        shell: bash
        working-directory: ${{ runner.temp }}/imagebuilder
        run: |
          image="$(find bin -type f -name "openwrt-${OPENWRT_VERSION}-x86-64-generic*ext4-combined-efi.img.gz" -print -quit)"
          test -n "$image"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$image" "$GITHUB_WORKSPACE/output/openwrt-${OPENWRT_VERSION}-x86-64-forkop-full-ext4-efi.img.gz"
          cd "$GITHUB_WORKSPACE/output"
          sha256sum *.img.gz > SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_VERSION }}-forkop-full-x86-64
          path: output/*
          if-no-files-found: error
          retention-days: 30
