name: Build OpenWrt Tachyon image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tachyon-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENWRT_VERSION: 25.12.6
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout image configuration
        uses: actions/checkout@v5

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl file gawk jq make perl python3 rsync tar unzip wget xz-utils zstd

      - name: Resolve Tachyon release
        id: tachyon_release
        run: |
          tag="$(gh release view --repo Dushnilin/tachyon --json tagName --jq .tagName)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download and verify Tachyon release APKs
        shell: bash
        run: |
          dir="$RUNNER_TEMP/tachyon-packages"
          mkdir -p "$dir"
          tag="${{ steps.tachyon_release.outputs.tag }}"
          gh release download "$tag" --repo Dushnilin/tachyon \
            --pattern 'tachyon_*.apk' \
            --pattern 'luci-app-tachyon_*.apk' \
            --pattern 'luci-i18n-tachyon-ru_*.apk' \
            --pattern sha256sums.txt --dir "$dir"
          release_json="$(gh api "repos/Dushnilin/tachyon/releases/tags/$tag")"
          for package in "$dir"/*.apk; do
            name="$(basename "$package")"
            expected="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest | sub("^sha256:"; "")' <<< "$release_json")"
            test -n "$expected"
            actual="$(sha256sum "$package" | awk '{print $1}')"
            test "$expected" = "$actual"
          done
          for pattern in 'tachyon_*.apk' 'luci-app-tachyon_*.apk' 'luci-i18n-tachyon-ru_*.apk'; do
            test -n "$(find "$dir" -maxdepth 1 -type f -name "$pattern" -print -quit)"
          done

      - name: Download and verify tachyon-core
        shell: bash
        run: |
          dir="$RUNNER_TEMP/tachyon-core"
          mkdir -p "$dir"
          tag="$(gh release view --repo Dushnilin/tachyon-core --json tagName --jq .tagName)"
          gh release download "$tag" --repo Dushnilin/tachyon-core --pattern 'tachyon-core-x86_64-*.apk' --pattern SHA256SUMS --dir "$dir"
          core="$(find "$dir" -maxdepth 1 -type f -name 'tachyon-core-x86_64-*.apk' -print -quit)"
          test -n "$core"
          name="$(basename "$core")"
          expected="$(awk -v n="$name" '$2 == n || $2 == "./" n {print $1; exit}' "$dir/SHA256SUMS")"
          test -n "$expected"
          actual="$(sha256sum "$core" | awk '{print $1}')"
          test "$expected" = "$actual"
          cp "$core" "$RUNNER_TEMP/tachyon-packages/"

      - name: Download and verify Argon release packages
        shell: bash
        run: |
          dir="$RUNNER_TEMP/argon-packages"
          mkdir -p "$dir"
          tag="$(gh release view --repo jerrykuku/luci-theme-argon --json tagName --jq .tagName)"
          gh release download "$tag" --repo jerrykuku/luci-theme-argon \
            --pattern 'luci-theme-argon-*.apk' \
            --pattern 'luci-app-argon-config-*.apk' \
            --pattern 'luci-i18n-argon-config-ru-*.apk' \
            --dir "$dir"
          release_json="$(gh api "repos/jerrykuku/luci-theme-argon/releases/tags/$tag")"
          for package in "$dir"/*.apk; do
            name="$(basename "$package")"
            expected="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest | sub("^sha256:"; "")' <<< "$release_json")"
            test -n "$expected"
            actual="$(sha256sum "$package" | awk '{print $1}')"
            test "$expected" = "$actual"
          done
          test -n "$(find "$dir" -maxdepth 1 -type f -name 'luci-theme-argon-*.apk' -print -quit)"
          test -n "$(find "$dir" -maxdepth 1 -type f -name 'luci-app-argon-config-*.apk' -print -quit)"
          test -n "$(find "$dir" -maxdepth 1 -type f -name 'luci-i18n-argon-config-ru-*.apk' -print -quit)"

      - name: Download OpenWrt ImageBuilder
        shell: bash
        run: |
          url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/openwrt-imagebuilder-${OPENWRT_VERSION}-x86-64.Linux-x86_64.tar.zst"
          archive="$RUNNER_TEMP/imagebuilder.tar.zst"
          curl --fail --location --retry 3 "$url" -o "$archive"
          echo "a792e29bd2233cda67a0823030bfb53c0b61fbb3836b2063e88adf89730d563b  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/imagebuilder"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/imagebuilder" --strip-components=1
          cp "$RUNNER_TEMP/tachyon-packages/"*.apk "$RUNNER_TEMP/imagebuilder/packages/"
          cp "$RUNNER_TEMP/tachyon-core/"*.apk "$RUNNER_TEMP/imagebuilder/packages/"
          cp "$RUNNER_TEMP/argon-packages/"*.apk "$RUNNER_TEMP/imagebuilder/packages/"
          cp "$RUNNER_TEMP/argon-packages/"*.apk "$RUNNER_TEMP/imagebuilder/packages/"
          chmod 0755 files/etc/uci-defaults/99-home-router-network
          sdk="https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          archive="$RUNNER_TEMP/openwrt-sdk-25.12.3.tar.zst"
          checksums="$RUNNER_TEMP/openwrt-sdk-25.12.3.sha256sums"
          curl --fail --location --retry 3 "$sdk" -o "$archive"
          curl --fail --location --retry 3 "https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/sha256sums" -o "$checksums"
          filename="$(basename "$sdk")"
          expected="$(awk -v n="$filename" '$2 == n || $2 == "*" n {print $1; exit}' "$checksums")"
          test -n "$expected"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$expected" = "$actual"
          apk_path="$(tar --zstd -tf "$archive" | grep -m1 '/staging_dir/host/bin/apk
      - name: Build UEFI EXT4 firmware
        working-directory: ${{ runner.temp }}/imagebuilder
        run: |
          make image PROFILE=generic \
            PACKAGES="luci-ssl luci-i18n-base-ru luci-theme-argon luci-app-argon-config luci-i18n-argon-config-ru kmod-r8169 r8169-firmware tachyon luci-app-tachyon luci-i18n-tachyon-ru tachyon-core" \
            FILES="${{ github.workspace }}/files" \
            EXTRA_IMAGE_NAME="tachyon"

      - name: Prepare firmware artifact
        shell: bash
        working-directory: ${{ runner.temp }}/imagebuilder
        run: |
          image="$(find bin -type f -name "openwrt-${OPENWRT_VERSION}-x86-64-generic*ext4-combined-efi.img.gz" -print -quit)"
          test -n "$image"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$image" "$GITHUB_WORKSPACE/output/openwrt-${OPENWRT_VERSION}-x86-64-tachyon-core-ext4-efi.img.gz"
          cd "$GITHUB_WORKSPACE/output"
          sha256sum *.img.gz > SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_VERSION }}-tachyon-core-x86-64
          path: output/*
          if-no-files-found: error
          retention-days: 30
)"
          test -n "$apk_path"
          apk_root="$RUNNER_TEMP/apk-indexer"
          mkdir -p "$apk_root"
          tar --zstd -xf "$archive" -C "$apk_root" --strip-components=3 --wildcards \
            '*/staging_dir/host/bin/apk' \
            '*/staging_dir/host/bin/.apk.bin' \
            '*/staging_dir/host/lib/*'
          apk_tool="$apk_root/bin/apk"
          test -x "$apk_tool"
          make -s -C "$RUNNER_TEMP/imagebuilder" _check_keys
          (
            cd "$RUNNER_TEMP/imagebuilder/packages"
            "$apk_tool" mkndx \
              --keys-dir "$RUNNER_TEMP/imagebuilder/keys" \
              --sign "$RUNNER_TEMP/imagebuilder/keys/local-private-key.pem" \
              --allow-untrusted --output packages.adb *.apk
          )
          test -s "$RUNNER_TEMP/imagebuilder/packages/packages.adb"

      - name: Build UEFI EXT4 firmware
        working-directory: ${{ runner.temp }}/imagebuilder
        run: |
          make image PROFILE=generic \
            PACKAGES="luci-ssl luci-i18n-base-ru luci-theme-argon luci-app-argon-config luci-i18n-argon-config-ru kmod-r8169 r8169-firmware tachyon luci-app-tachyon luci-i18n-tachyon-ru tachyon-core" \
            FILES="${{ github.workspace }}/files" \
            EXTRA_IMAGE_NAME="tachyon"

      - name: Prepare firmware artifact
        shell: bash
        working-directory: ${{ runner.temp }}/imagebuilder
        run: |
          image="$(find bin -type f -name "openwrt-${OPENWRT_VERSION}-x86-64-generic*ext4-combined-efi.img.gz" -print -quit)"
          test -n "$image"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$image" "$GITHUB_WORKSPACE/output/openwrt-${OPENWRT_VERSION}-x86-64-tachyon-core-ext4-efi.img.gz"
          cd "$GITHUB_WORKSPACE/output"
          sha256sum *.img.gz > SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_VERSION }}-tachyon-core-x86-64
          path: output/*
          if-no-files-found: error
          retention-days: 30
